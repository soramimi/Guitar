name: AppImage

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf automake libtool \
          ruby \
          qmake6 \
          libqt6core5compat6-dev \
          zlib1g-dev \
          libzstd-dev zstd \
          libgl1-mesa-dev \
          libssl-dev \
          libsodium-dev \
          libcurl4-openssl-dev \
          libsecret-1-dev \
          qt6-base-dev \
          qt6-svg-dev \
          mecab-utils \
          wget \
          desktop-file-utils
          
    - name: Prepare environment
      run: ruby prepare.rb
      
    - name: Build Guitar
      run: |
        ruby scripts/make_all.rb
        
    - name: Download linuxdeploy
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
        
    - name: Create AppDir structure
      run: |
        umask 022
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib/soramimi.jp
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
        
        # Copy binary
        install -m 755 _bin/Guitar AppDir/usr/bin/
        install -m 644 lib/soramimi.jp/libfiletypeplugin.so AppDir/usr/lib/soramimi.jp/
        install -m 644 lib/soramimi.jp/libincrementalsearchplugin.so AppDir/usr/lib/soramimi.jp/
        
        # Create desktop file
        cat > AppDir/usr/share/applications/guitar.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=Guitar
        Comment=Git GUI Client
        Exec=Guitar
        Icon=guitar
        Categories=Development;RevisionControl;
        StartupNotify=true
        EOF
        
        install -m 644 LinuxDesktop/Guitar.svg AppDir/usr/share/icons/hicolor/scalable/apps/guitar.svg
        
    - name: Create AppImage
      run: |
        umask 022
        export APPIMAGE_EXTRACT_AND_RUN=1
        export PATH="$PWD:$PATH"
        export QMAKE="$(command -v qmake6)"
        export QML_SOURCES_PATHS=""
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
        
    - name: Rename AppImage
      run: |
        if [ -f "Guitar-x86_64.AppImage" ]; then
          if [ "${{ github.ref_type }}" = "tag" ]; then
            mv Guitar-x86_64.AppImage Guitar-${{ github.ref_name }}-x86_64.AppImage
          else
            mv Guitar-x86_64.AppImage Guitar-nightly-x86_64.AppImage
          fi
        fi
        
    - name: Test AppImage
      run: |
        ls -la Guitar-*.AppImage
        file Guitar-*.AppImage
        
    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: guitar-appimage
        path: Guitar-*.AppImage
        
    - name: Release AppImage
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: Guitar-*.AppImage
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
