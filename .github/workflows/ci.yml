name: CI

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ruby \
          qmake6 \
          libqt6core6 \
          libqt6gui6 \
          libqt6svg6-dev \
          libqt6core5compat6-dev \
          zlib1g-dev \
          libzstd-dev \
          libgl1-mesa-dev \
          libssl-dev \
          libsodium-dev \
          qt6-base-dev \
          qt6-svg-dev \
          libcurl4-openssl-dev \
          libsecret-1-dev \
          libgtest-dev \
          mecab-utils
          
    - name: Build Guitar
      run: |
        ruby scripts/make_all.rb
        
    - name: Test plugin runtime and error handling
      run: |
        mkdir -p _build-loaderfixture _build-plugin-runtime
        cd _build-loaderfixture
        qmake6 ../tests/PluginRuntime/fixtures/loaderfixture.pro CONFIG+=release
        make -j2
        cd ../_build-plugin-runtime
        qmake6 ../tests/PluginRuntime/PluginRuntime.pro CONFIG+=release CONFIG+=sanitize
        make -j2
        ASAN_OPTIONS=detect_leaks=0 ./PluginRuntimeTest

    - name: Test Git command arguments and literal paths
      run: |
        mkdir -p _build-git-execution
        cd _build-git-execution
        qmake6 ../tests/GitExecution/GitExecution.pro CONFIG+=release CONFIG+=reuse_app_objects
        make -j2
        QT_QPA_PLATFORM=offscreen ./GitExecutionTest

    - name: Test build
      run: |
        ls -la _bin/
        file _bin/Guitar
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: guitar-linux-amd64
        path: _bin/Guitar

